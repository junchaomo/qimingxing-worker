name: qimingxing-worker

on:
  schedule:
    # 每 5 分钟处理一次队列（兜底）
    - cron: '*/5 * * * *'
  workflow_dispatch:   # 支持手动触发和 API 触发
  repository_dispatch: # 支持前端通过 API 触发
    types: [trigger-worker]

jobs:
  process:
    runs-on: ubuntu-latest
    # 长音频转写 + 说话人分离需要足够时间
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ASR worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          # 阿里云 OSS（Filetrans 音频中转，阿里服务器无法直接访问 Supabase）
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # 使用 Filetrans 异步模型，支持阿里自带的说话人分离
          DASHSCOPE_MODEL: qwen-audio-3.0-asr-flash-filetrans
          DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/api/v1
          ASR_AUDIO_FORMAT: wav
          ASR_SAMPLE_RATE: '16000'
          ENABLE_ITN: 'true'
          WORKER_CONCURRENCY: '4'
          WORKER_THREADS: '5'
          VAD_SEGMENT_THRESHOLD_S: '30'
          MAX_SEGMENT_S: '60'
          POLL_INTERVAL_S: '3'
          SEGMENT_MAX_RETRIES: '3'
          TASK_MAX_RETRIES: '2'
          # pyannote 说话人分离已禁用，改用阿里 Qwen3-ASR Filetrans 自带的说话人分离
          ENABLE_SPEAKER_DIARIZATION: 'false'
        run: |
          # 空闲 60 轮（约 3 分钟）无任务即退出；有任务则持续处理直到 job 超时
          python main.py --idle-exit 60
